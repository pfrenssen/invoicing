user www-data;
daemon off;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 32m;

    client_body_temp_path /tmp/nginx/body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    scgi_temp_path /tmp/nginx/scgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/build;
        index index.php;

        # Source files, hidden files and text files of Drupal are never served.
        # Only .well-known is.
        location ~* \.(engine|inc|info|install|make|module|profile|test|po|sh|sql|theme|tpl(\.php)?|xtmpl)$ {
            return 404;
        }
        location ~ (^|/)\.(?!well-known/) {
            return 404;
        }
        location ~ ^/(CHANGELOG|COPYRIGHT|INSTALL[^/]*|LICENSE|MAINTAINERS|README|UPGRADE)\.txt$ {
            return 404;
        }
        location ~ /composer\.(json|lock)$ {
            return 404;
        }

        # The private files are served by Drupal, after a check of access.
        # PHP files in the public files are never run.
        location ~ ^/sites/[^/]+/files/private(/|$) {
            return 404;
        }
        location ~ ^/sites/[^/]+/files/.*\.php$ {
            return 404;
        }

        # Drupal creates a derivative of an image at the first request for it.
        location ~ ^/sites/[^/]+/files/styles/ {
            try_files $uri /index.php$is_args$args;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # Only these scripts of Drupal are reachable. xmlrpc.php and
        # authorize.php are not used.
        location ~ ^/(index|install|update|cron)\.php$ {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_hide_header X-Generator;
        }
        location ~ \.php$ {
            return 404;
        }

        location ~* \.(css|gif|ico|jpeg|jpg|js|png|svg|woff2?)$ {
            expires max;
            log_not_found off;
            try_files $uri /index.php$is_args$args;
        }
    }
}
