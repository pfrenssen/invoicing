; Pool settings for Invoicing. The file name sorts after zz-docker.conf of the
; PHP image, so these values replace its listen address.

[www]
; Only nginx in this container connects to PHP-FPM.
listen = 127.0.0.1:9000
; Send the errors of PHP to the log of the container.
catch_workers_output = yes
decorate_workers_output = no
